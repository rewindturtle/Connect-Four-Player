; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The stock board definition is the N8 variant: 8MB quad flash, no PSRAM.
; The WROOM-2 module has octal flash and octal PSRAM, so both buses have to
; be overridden or the PSRAM is never initialised.
board_build.flash_mode = opi
board_build.psram_type = opi

; 32MB of flash instead of the 8MB the board definition assumes
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_16MB.csv

; PSRAM CONFIG
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1